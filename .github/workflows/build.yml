name: Fabriquer KATOU APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Générer la structure Android
        run: flutter create . --platforms=android --org com.katou.app

      - name: Télécharger les dépendances
        run: flutter pub get

      - name: Fabriquer l'application Android (APK)
        run: flutter build apk --release

      - name: Sauvegarder le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: KATOU-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
